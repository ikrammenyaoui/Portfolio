<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <clipPath id="clip-path">
      <circle cx="250" cy="250" r="240" fill="none"/>
    </clipPath>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6d28d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#db2777;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="250" cy="250" r="240" fill="#f8f8f8" />
  <g clip-path="url(#clip-path)">
    <rect x="0" y="0" width="500" height="500" fill="#f8f8f8" />
    <text x="250" y="250" font-family="Arial" font-size="120" text-anchor="middle" dominant-baseline="middle" fill="url(#grad1)">IM</text>
  </g>
  <circle cx="250" cy="250" r="240" fill="none" stroke="url(#grad1)" stroke-width="5" />
</svg>